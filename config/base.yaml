paths:
  sqlite_db: data/warehouse/sqlite/fundlab.db
  parquet_root: data/warehouse/parquet
  log_dir: logs

data:
  default_feature_version: v1
  source: xtquant
  default_start_date: "2023-01-01"
  default_end_date: "2026-05-07"
  validation_symbols:
    - 510300.SH
    - 510500.SH
    - 518880.SH

xtquant:
  calendar_market: SH
  calendar_probe_symbol: 510300.SH
  fund_sectors:
    - 沪深基金
    - 上证基金
    - 深证基金

universe:
  include_product_types:
    - ETF
    - MONEY_ETF
  include_management_types:
    - passive_index
    - smart_beta
    - passive_bond
    - passive_commodity
    - passive_money_market
    - cross_border_index
