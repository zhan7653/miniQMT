paths:
  sqlite_db: ../data/warehouse/sqlite/fundlab.db
  parquet_root: ../data/warehouse/parquet
  log_dir: ../logs
  v2_catalog: ../data/warehouse/v2/catalog.sqlite3
  v2_raw_root: ../data/warehouse/v2/raw
  v2_staging_root: ../data/warehouse/v2/staging
  v2_published_root: ../data/warehouse/v2/published
  v2_report_root: ../data/reports/data_v2
  paper_db: ../data/warehouse/v2/paper_trading.sqlite3
  paper_report_root: ../data/reports/data_v2/paper_trading

platform:
  timezone: Asia/Hong_Kong

providers:
  enabled:
    - xtquant
  fallback: null

reviewed_universe:
  config_path: universe.yaml
  benchmark_symbols:
    - 510300.SH
  feature_lookback_days: 120

data:
  default_feature_version: v1
  source: xtquant
  default_start_date: "2023-01-01"
  default_end_date: "2026-05-07"
  validation_symbols:
    - 510300.SH
    - 510500.SH
    - 518880.SH

xtquant:
  calendar_market: SH
  calendar_probe_symbol: 510300.SH
  fund_sectors:
    - 沪深基金
    - 上证基金
    - 深证基金

full_market_history:
  partition_years: 1
  retry:
    max_attempts: 3
    backoff_seconds:
      - 5
      - 15
      - 30
  throttle:
    initial:
      workers: 1
      request_interval_seconds: 2
      cooldown_every_symbols: 20
      cooldown_seconds: 60
    maximum:
      workers: 4
      requests_per_second: 2
      cooldown_every_symbols: 100
      cooldown_seconds: 30
  coverage:
    min_usable_instruments_ratio: 0.95
    min_expected_days_ratio: 0.98
    min_symbol_trading_day_ratio: 0.95
    daily_min_active_ratio: 0.99
  canary:
    sample_limit: 20
  critical_symbols:
    - 510300.SH

universe:
  include_product_types:
    - ETF
    - MONEY_ETF
  include_management_types:
    - passive_index
    - smart_beta
    - passive_bond
    - passive_commodity
    - passive_money_market
    - cross_border_index
