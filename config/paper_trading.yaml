paths:
  paper_db: ../data/warehouse/v2/paper_trading.sqlite3
  paper_report_root: ../data/reports/data_v2/paper_trading

paper_trading:
  default_initial_cash: 1000000
  default_benchmark: 510300.SH
  risk_free_rate: 0.0

data_platform_config: base.yaml

universes:
  reviewed-v1:
    - 510300.SH
    - 510500.SH
    - 518880.SH

strategy_configs:
  - strategy_id: equal_weight
    version: reviewed_v1
    parameters:
      symbols: [510300.SH, 510500.SH, 518880.SH]
      cash_weight: 0.0
  - strategy_id: momentum_rotation
    version: reviewed_v1
    parameters:
      max_positions: 3
      cash_weight: 0.0

default_accounts:
  - account_id: equal_weight_reviewed_v1
    name: Equal Weight - Reviewed ETF Universe
    strategy_id: equal_weight
    strategy_config_version: reviewed_v1
    universe_version: reviewed-v1
    benchmark_symbol: 510300.SH
    execution_profile_id: etf_default
    execution_profile_version: v1
    risk_profile_id: research_default
    risk_profile_version: v1
    initial_cash: 1000000
    schedule: daily
  - account_id: momentum_reviewed_v1
    name: Momentum Rotation - Reviewed ETF Universe
    strategy_id: momentum_rotation
    strategy_config_version: reviewed_v1
    universe_version: reviewed-v1
    benchmark_symbol: 510300.SH
    execution_profile_id: etf_default
    execution_profile_version: v1
    risk_profile_id: research_default
    risk_profile_version: v1
    initial_cash: 1000000
    schedule: daily

execution_profiles:
  etf_default_v1:
    profile_id: etf_default
    version: v1
    commission_bps: 3.0
    minimum_commission: 0.0
    slippage_bps: 2.0
    lot_size: 100
    capacity_fraction: 0.05
    capacity_lookback_days: 20

risk_profiles:
  research_default_v1:
    profile_id: research_default
    version: v1
    etf_only: true
    allow_short: false
    allow_leverage: false
    require_nonnegative_cash: true
    max_position_weight: null
    minimum_cash_weight: null
    reject_untrusted_premium_discount: true
