    - account_id: paper-crash-cn-small
      name: "Paper Crisis China Compact"
      initial_cash: "1000000"
      strategy: agent-file
    - account_id: paper-crash-cn-wide
      name: "Paper Crisis China Wide"
      initial_cash: "1000000"
