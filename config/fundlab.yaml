    - account_id: paper-low-beta
      name: "Paper Low Beta Volatility"
      initial_cash: "1000000"
      strategy: agent-file
    - account_id: paper-st-removal
      name: "Paper ST Removal Momentum"
      initial_cash: "1000000"
      strategy: agent-file
    - account_id: paper-st-momentum
      name: "Paper Active ST Momentum"
      initial_cash: "1000000"
