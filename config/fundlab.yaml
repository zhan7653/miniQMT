paths:
  market_data: ../data/warehouse/v2/canonical
  trading_database: ../data/warehouse/v2/trading.sqlite3
  report_root: ../data/reports/data_v2/canonical

daily:
  # A session counts as completed only after this local time; before it the
  # pipeline targets the previous open session.
  session_cutoff_local: "19:00"
  agent_decision_dir: ../data/agent/decisions
  report_dir: ../data/reports/daily
  source_pair: [tickflow, xtquant]
  adjudicator: baostock
  batch_size: 100
  # The canonical calendar carries exchange-announced sessions this many days
  # past today (both calendar sources must agree over the full window), so an
  # intent decided at the published data head can schedule its T+1 order.
  calendar_horizon_days: 60
  accounts:
    - account_id: paper-1
      name: "Paper 1 (static ETF mix)"
      initial_cash: "1000000"
      strategy: static
      weights:
        510300.SH: "0.6"
        511010.SH: "0.4"
    - account_id: paper-agent
      name: "Paper Agent (file decisions)"
      initial_cash: "1000000"
      strategy: agent-file
    - account_id: paper-dividend
      name: "Paper Dividend Value Agent"
      initial_cash: "1000000"
      strategy: agent-file

agent:
  # OpenAI-compatible Responses endpoint. The API key is read only from the
  # named environment variable; no secret belongs in this file.
  llm:
    base_url: https://way.696998.xyz/v1
    model: gpt-5.6-sol
    api_key_env: FUNDLAB_LLM_API_KEY
    reasoning_effort: medium
    max_output_tokens: 32768
    timeout_seconds: 300
    max_retries: 2
    store: false
  library:
    root: ../data/agent/library
    # Only explicitly listed .md/.txt files are sent to the trusted relay.
    documents: []
    max_document_chars: 40000
    max_total_chars: 120000
  memory:
    root: ../data/agent/memory
    recent_entries: 20
    max_entry_chars: 20000
    max_total_chars: 120000
  notify:
    # Set a recipient to enable best-effort SMTP opportunity/risk mail.
    email_to:

  # The daily task attempts scheduled policies before and after publication.
  # A policy failure writes no decision file, which the kernel treats as hold.
  policies:
    paper-agent:
      type: momentum-rotation
      risk_instrument: 510300.SH
      defensive_instrument: 511010.SH
      momentum_days: 60
      threshold: "0"
      risk_on:
        510300.SH: "0.7"
        511010.SH: "0.3"
      risk_off:
        510300.SH: "0.1"
        511010.SH: "0.9"
    paper-dividend:
      type: dividend-value
      # Gray release: manual `--force-review --dry-run` first. Flip to true
      # only after one real Responses call and its decision validation pass.
      scheduled: false
      charter: agents/dividend-value.yaml
      top_n: 10
      min_yield: "0.04"
      min_dividend_years: 5
      min_avg_amount: "20000000"
      alert_min_yield: "0.06"
      cash_reserve: "0.05"
      candidate_pool_size: 50
      rebalance_cooldown_days: 28

execution:
  policy_id: cn-daily-conservative
  version: "2026-07-18"
  maximum_participation: "0.05"
  base_slippage_bps: "2"
  impact_bps_at_max_participation: "20"
  block_at_price_limit: true
  allow_partial_fills: true
  subscribe_rights: false

risk:
  policy_id: local-long-only
  version: "1"
  max_position_weight: "1"
  minimum_cash_weight: "0"
  allowed_asset_types: [stock, etf]

fees:
  schedule_id: cn-simulation-reference
  version: "2026-07-18"
  # This is a versioned simulation assumption, not a claim about a real broker account.
  # Live or broker-parity work must supply a separately verified account schedule.
  trusted_for_simulation: true
  verification_note: Public taxes plus an explicit 0.03%/CNY 5 minimum commission model for reproducible simulation.
  rules:
    - effective_from: "2015-08-01"
      effective_to: "2022-04-28"
      asset_types: [stock]
      exchanges: [SH, SZ]
      broker_commission_rate: "0.0003"
      minimum_commission: "5"
      stamp_duty_sell_rate: "0.001"
      transfer_fee_rate: "0.00002"
      exchange_handling_rate: "0"
      regulatory_levy_rate: "0"
      evidence: "ChinaClear 2015-07-09 notice: unified SH/SZ A-share transfer fee at 0.02 per mille from 2015-08-01; pre-2023 sell stamp duty 0.1%."
    - effective_from: "2022-04-29"
      effective_to: "2023-08-27"
      asset_types: [stock]
      exchanges: [SH, SZ]
      broker_commission_rate: "0.0003"
      minimum_commission: "5"
      stamp_duty_sell_rate: "0.001"
      transfer_fee_rate: "0.00001"
      exchange_handling_rate: "0"
      regulatory_levy_rate: "0"
      evidence: "ChinaClear 2022-04-28 notice: SH/SZ A-share transfer fee reduced to 0.01 per mille from 2022-04-29; pre-2023 sell stamp duty 0.1%."
    - effective_from: "2023-08-28"
      asset_types: [stock]
      exchanges: [SH, SZ]
      broker_commission_rate: "0.0003"
      minimum_commission: "5"
      stamp_duty_sell_rate: "0.0005"
      transfer_fee_rate: "0.00001"
      exchange_handling_rate: "0"
      regulatory_levy_rate: "0"
      evidence: "Public tax rates plus an explicit simulation commission assumption; not a broker-account claim."
    - effective_from: "2015-08-01"
      effective_to: "2023-08-27"
      asset_types: [etf]
      exchanges: [SH, SZ]
      broker_commission_rate: "0.0003"
      minimum_commission: "5"
      stamp_duty_sell_rate: "0"
      transfer_fee_rate: "0"
      exchange_handling_rate: "0"
      regulatory_levy_rate: "0"
      evidence: "Explicit ETF simulation commission assumption; no stock stamp duty or A-share transfer fee."
    - effective_from: "2023-08-28"
      asset_types: [etf]
      exchanges: [SH, SZ]
      broker_commission_rate: "0.0003"
      minimum_commission: "5"
      stamp_duty_sell_rate: "0"
      transfer_fee_rate: "0"
      exchange_handling_rate: "0"
      regulatory_levy_rate: "0"
      evidence: "Explicit ETF simulation commission assumption; not a broker-account claim."
