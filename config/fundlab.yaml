      initial_cash: "1000000"
      strategy: agent-file

agent:
  # OpenAI-compatible Responses endpoint. The API key is read only from the
  # named environment variable; no secret belongs in this file.
  llm:
    base_url: https://way.696998.xyz/v1
    model: gpt-5.6-sol
    api_key_env: FUNDLAB_LLM_API_KEY
    reasoning_effort: medium
    max_output_tokens: 32768
    timeout_seconds: 300
    max_retries: 2
    store: false
  library:
    root: ../data/agent/library
    # Only explicitly listed .md/.txt files are sent to the trusted relay.
    documents: []
    max_document_chars: 40000
    max_total_chars: 120000
  memory:
    root: ../data/agent/memory
    recent_entries: 20
    max_entry_chars: 20000
    max_total_chars: 120000
  notify:
    # Optional YAML recipient. FUNDLAB_EMAIL_TO from .env.local takes priority;
    # when both are empty, FUNDLAB_SMTP_USER receives the notification.
    email_to:

  # The daily task attempts scheduled policies before and after publication.
  # A policy failure writes no decision file, which the kernel treats as hold.
  policies:
    paper-agent:
      type: momentum-rotation
      risk_instrument: 510300.SH
      defensive_instrument: 511010.SH
      momentum_days: 60
      threshold: "0"
      risk_on:
        510300.SH: "0.7"
        511010.SH: "0.3"
      risk_off:
        510300.SH: "0.1"
        511010.SH: "0.9"
    paper-dividend:
      type: dividend-value
      # Enabled after a real Responses dry-run and local decision validation
      # completed successfully on 2026-07-29.
      scheduled: true
      charter: agents/dividend-value.yaml
      top_n: 10
      min_yield: "0.04"
      min_dividend_years: 5
      min_avg_amount: "20000000"
      alert_min_yield: "0.06"
      cash_reserve: "0.05"
      candidate_pool_size: 50
      rebalance_cooldown_days: 28
      # Passive high-dividend reference only; it never enters the stock portfolio.
      benchmark_instrument: 159207.SZ
      # Relative performance is diagnostic before 60 common trading sessions
      # and can never be the sole reason for a rebalance afterwards.
      benchmark_min_common_sessions: 60
    paper-dividend-rules:
      type: dividend-rules
      charter: agents/dividend-value.yaml
      top_n: 10
      min_yield: "0.04"
      min_dividend_years: 5
      min_avg_amount: "20000000"
      max_fiscal_year_lag: 2
      require_ttm_cash: true
      cash_reserve: "0.05"
      rebalance_cooldown_days: 28
    paper-dual-momentum:
      type: dual-momentum
      risk_instruments: [510300.SH, 510500.SH, 159915.SZ, 518880.SH]
      defensive_instrument: 511010.SH
      short_momentum_days: 60
      long_momentum_days: 120
      select_count: 2
      threshold: "0"
    paper-inverse-vol:
      type: inverse-volatility
      instruments: [510300.SH, 511010.SH, 518880.SH]
      volatility_days: 60
      max_weight: "0.60"
    paper-risk-parity:
      type: correlation-risk-parity
      instruments: [510300.SH, 510500.SH, 159915.SZ, 518880.SH, 511010.SH]
      return_days: 120
      covariance_shrinkage: "0.25"
      max_weight: "0.50"
    paper-trend-vol:
      type: trend-volatility-target
      risk_instruments: [510300.SH, 510500.SH, 159915.SZ, 518880.SH]
