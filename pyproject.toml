[project]
name = "fundlab"
version = "0.1.0"
description = "Exchange-traded rule-based fund lab built around local trusted data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "backtrader>=1.9.78.123",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

