[project]
name = "fundlab"
version = "0.1.0"
description = "Local canonical market-data and trading-simulation foundation for a future agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.64,<1.19",
    "baostock>=0.9.3,<0.10",
    "efinance>=0.5.9,<0.6",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.2",
    "pyaes>=1.6.1,<2",
    "pyarrow>=15.0",
    "pypdf>=5,<7",
    "pyyaml>=6.0",
    "uvicorn>=0.30,<1",
]

[project.scripts]
fundlab = "fundlab.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fundlab"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "DTZ", "PLR0124", "RUF012"]
ignore = ["DTZ007"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["DTZ", "RUF012"]
