[project]
name = "fundlab"
version = "0.1.0"
description = "Local canonical market-data and trading-simulation foundation for a future agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.64,<1.19",
    "baostock>=0.9.3,<0.10",
    "efinance>=0.5.9,<0.6",
    "openpyxl>=3.1,<4",
    "pandas>=2.2",
    "pyaes>=1.6.1,<2",
    "pyarrow>=15.0",
    "pypdf>=5,<7",
    "pyyaml>=6.0",
]

[project.scripts]
fundlab = "fundlab.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fundlab"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
